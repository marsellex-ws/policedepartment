<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b1c">
  <meta name="description" content="Активность шефов LSPD, SFPD и LVPD — Police Department">
  <title>Активность шефов — Police Department</title>
  <link rel="icon" href="pd_photo.png" type="image/png">
  <link rel="preconnect" href="https://police-api-b2y4.onrender.com" crossorigin>
  <link rel="preload" href="chiefs_assets/city-night.webp" as="image" type="image/webp">
  <script src="api-fetch-retry.js"></script>
  <script src="site-session.js"></script>
  <script src="page-ready.js"></script>
  <script src="role-ui.js" defer></script>
  <style>
    :root{
      color-scheme:dark;
      --bg:#060c1d;--bg2:#09132b;--text:#eef6ff;--muted:#9fb4d6;--stroke:rgba(111,164,232,.24);
      --cyan:#53c4ff;--cyan-rgb:83,196,255;
      --green:#53f0c4;--green-rgb:83,240,196;
      --blue:#5f96ff;--blue-rgb:95,150,255;
      --pink:#ff4d96;--pink-rgb:255,77,150;
      --gold:#ffcb58;--gold-rgb:255,203,88;
      --glass:rgba(7,17,38,.68);
      --panel:rgba(8,20,45,.82);
      --shadow:0 20px 60px rgba(0,0,0,.38);
      --header-h:84px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;overflow-x:hidden;background:#040a18;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif}
    a{text-decoration:none;color:inherit}
    img{display:block;max-width:100%}
    button{font:inherit;color:inherit;cursor:pointer}
    button:focus-visible,a:focus-visible{outline:2px solid #8cd7ff;outline-offset:3px}

    .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;
      background:
        linear-gradient(180deg,rgba(4,10,24,.78) 0%,rgba(4,10,24,.55) 20%,rgba(4,10,24,.68) 55%,rgba(2,8,20,.92) 100%),
        url('chiefs_assets/city-night.webp') center/cover no-repeat;
    }
    .bg::before{content:"";position:absolute;inset:-15%;background:
        radial-gradient(circle at 18% 25%, rgba(68,147,255,.32), transparent 28%),
        radial-gradient(circle at 80% 28%, rgba(255,60,134,.30), transparent 25%),
        radial-gradient(circle at 52% 72%, rgba(255,184,60,.16), transparent 26%);
      filter:blur(34px);animation:floatGlow 16s ease-in-out infinite alternate;opacity:.92}
    .bg::after{content:"";position:absolute;inset:0;opacity:.22;background-image:
      linear-gradient(rgba(133,180,255,.1) 1px, transparent 1px),
      linear-gradient(90deg, rgba(133,180,255,.08) 1px, transparent 1px);
      background-size:64px 64px;mask-image:linear-gradient(180deg,transparent,#000 25%,#000 86%,transparent)}
    .scanline{position:fixed;inset:auto 0 28px 0;height:2px;z-index:0;background:linear-gradient(90deg,transparent,#53c4ff 18%,#ff4d96 50%,#53c4ff 82%,transparent);box-shadow:0 0 16px #53c4ff99,0 0 22px #ff4d9688;animation:scan 7s linear infinite;opacity:.4;pointer-events:none}
    .wrap{width:min(1540px,calc(100% - 54px));margin-inline:auto;position:relative;z-index:1}

    .site-header{position:sticky;top:0;z-index:110;min-height:var(--header-h);border-bottom:1px solid rgba(120,181,255,.14);
      background:linear-gradient(90deg,rgba(4,10,24,.95),rgba(7,14,34,.92) 50%,rgba(4,10,24,.96)),url('reestr_shapk.png') center/cover;
      backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.32)}
    .header-inner{min-height:var(--header-h);display:flex;align-items:center;gap:24px;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;min-width:0;flex-shrink:0}
    .brand img{width:44px;height:50px;object-fit:contain;filter:drop-shadow(0 0 16px rgba(72,179,255,.35))}
    .brand strong{font-size:clamp(14px,1.2vw,18px);font-weight:950;letter-spacing:.03em;white-space:nowrap}
    .main-nav{display:flex;align-items:center;justify-content:center;gap:6px;flex:1;min-width:0}
    .main-nav a{display:flex;align-items:center;gap:8px;padding:11px 15px;border-radius:14px;border:1px solid transparent;color:#9cb6d8;font-size:12px;font-weight:800;white-space:nowrap;transition:.25s}
    .main-nav a:hover{color:#fff;background:rgba(17,52,90,.55)}
    .main-nav a.active{color:#f7fbff;border-color:rgba(83,196,255,.38);background:linear-gradient(140deg,rgba(30,68,133,.86),rgba(16,32,71,.92));box-shadow:inset 0 -2px 0 #58ccff,0 0 24px rgba(41,125,255,.22)}
    .nav-icon{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .right-tools{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-shrink:0}
    .divider{width:1px;height:36px;background:rgba(112,160,215,.36)}
    .mobile-nav{display:none}

    .hero{padding:34px 0 12px;text-align:center}
    .hero-row{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start}
    .hero-left{display:grid;justify-items:center}
    .hero-kicker{display:flex;align-items:center;justify-content:center;gap:10px;color:#ff70b2;font-size:11px;font-weight:900;letter-spacing:.24em;text-transform:uppercase}
    .hero-kicker::before{content:"";width:20px;height:9px;clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);background:linear-gradient(90deg,#ff3e9e,#ff7fc1)}
    .hero h1{margin:12px 0 10px;font-size:clamp(42px,5.2vw,86px);line-height:1;font-weight:1000;letter-spacing:-.055em;text-shadow:0 10px 36px rgba(0,0,0,.38)}
    .hero h1 span{background:linear-gradient(100deg,#f4f7ff 12%,#87cfff 39%,#4e8fff 56%,#ff49a0 88%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .hero p{margin:0;color:#9cb4d4;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase}
    .hero-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .chip{display:inline-flex;align-items:center;gap:8px;border-radius:15px;padding:12px 16px;min-height:48px;border:1px solid rgba(105,152,221,.28);
      background:linear-gradient(140deg,rgba(8,20,46,.88),rgba(10,18,42,.82));box-shadow:0 10px 30px rgba(0,0,0,.26)}
    .chip svg{width:17px;height:17px;color:#6fc4ff;flex-shrink:0}
    .date-chip{min-width:215px;justify-content:space-between;text-align:left}
    .date-block b{display:block;font-size:28px;line-height:1;font-weight:950;color:#f4f8ff}
    .date-block small{display:block;font-size:11px;color:#8ea8c8;text-transform:uppercase;letter-spacing:.16em;margin-bottom:6px}
    .live-block{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#5af1c3;text-transform:uppercase;letter-spacing:.12em}
    .live-dot{width:9px;height:9px;border-radius:50%;background:#4deeb8;box-shadow:0 0 14px #4deeb8}
    .period-toggle{display:inline-flex;gap:4px;padding:4px;border-radius:15px;border:1px solid rgba(105,152,221,.28);background:rgba(7,18,41,.86)}
    .period-toggle button{border:0;background:transparent;color:#94aecf;border-radius:11px;padding:10px 14px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;transition:.22s}
    .period-toggle button[aria-pressed="true"]{color:#fff;background:linear-gradient(140deg,rgba(31,72,143,.9),rgba(16,30,70,.92));box-shadow:inset 0 -2px 0 #58ccff,0 0 16px rgba(45,120,255,.18)}
    .refresh-chip,.edit-chip{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 16px;border-radius:15px;font-size:12px;font-weight:900;letter-spacing:.06em;transition:.2s}
    .refresh-chip{border:1px solid rgba(91,154,221,.3);background:linear-gradient(140deg,rgba(8,20,46,.88),rgba(10,18,42,.82))}
    .refresh-chip:hover{border-color:rgba(123,208,255,.5);background:rgba(14,36,73,.92)}
    .edit-chip{border:1px solid rgba(255,110,184,.28);background:linear-gradient(140deg,rgba(62,22,63,.52),rgba(28,11,37,.68));color:#ffd9ef}
    .edit-chip:hover{border-color:rgba(255,140,208,.48);background:rgba(80,28,82,.7)}
    .edit-chip[hidden]{display:none!important}
    .refresh-chip:disabled{opacity:.65;cursor:wait}

    .stage-section{padding:18px 0 4px}
    .scene-shell{position:relative;border-radius:34px;padding:32px 22px 30px;background:linear-gradient(180deg,rgba(6,14,31,.48),rgba(5,13,31,.14));overflow:hidden;min-height:780px}
    .scene-shell::before{content:"";position:absolute;inset:12% -3% auto -3%;height:1px;background:linear-gradient(90deg,transparent,rgba(83,196,255,.55),rgba(255,77,150,.4),transparent);filter:blur(.2px)}
    .scene-shell::after{content:"";position:absolute;left:50%;bottom:70px;transform:translateX(-50%);width:min(1080px,85%);height:170px;background:radial-gradient(ellipse at center, rgba(0,0,0,.48) 0%, rgba(0,0,0,.08) 60%, transparent 70%);filter:blur(20px);pointer-events:none}
    .background-sign{position:absolute;top:72px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;opacity:.24;text-shadow:0 0 30px currentColor;line-height:1.05;pointer-events:none}
    .background-sign small{display:block;font-size:18px;opacity:.72;font-weight:700;letter-spacing:.16em}
    .background-sign.left{left:28px;color:#63ffe4;text-align:left}
    .background-sign.center{left:50%;transform:translateX(-50%);top:108px;color:#68b8ff;text-align:center}
    .background-sign.right{right:36px;color:#ff5ea7;text-align:right}
    .podium-scene{position:relative;display:grid;grid-template-columns:1fr 1.24fr 1fr;gap:28px;align-items:end;padding:190px 0 0;min-height:680px}
    .slot{position:relative;display:flex;align-items:end;justify-content:center;min-width:0}
    .slot.first{z-index:3;transform:translateY(-14px)}
    .slot.second{z-index:2}
    .slot.third{z-index:2}
    .card-wrap{position:relative;width:100%;max-width:410px;perspective:1600px}
    .slot.first .card-wrap{max-width:500px}
    .rank-card{
      --accent:#62ffe3;--accent-rgb:98,255,227;--accent-soft:#4dd9b3;--scene:url('chiefs_assets/fone_lspd.png');
      position:relative;isolation:isolate;transform-style:preserve-3d;border-radius:32px;overflow:visible;min-height:545px;
      background:linear-gradient(180deg,rgba(4,13,32,.78),rgba(5,12,30,.98));
      border:1px solid rgba(var(--accent-rgb),.36);box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), inset 0 0 42px rgba(var(--accent-rgb),.09), 0 28px 65px rgba(0,0,0,.38);
      transition:transform .45s cubic-bezier(.2,.75,.22,1), box-shadow .35s ease;
    }
    .slot.second .rank-card{transform:rotateY(17deg) rotateX(3deg) translateY(18px)}
    .slot.first .rank-card{transform:translateZ(0) translateY(-10px) scale(1.02)}
    .slot.third .rank-card{transform:rotateY(-17deg) rotateX(3deg) translateY(18px)}
    .rank-card:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), inset 0 0 42px rgba(var(--accent-rgb),.14), 0 38px 78px rgba(0,0,0,.48)}
    .rank-card::before{content:"";position:absolute;inset:0;border-radius:32px;z-index:-3;background:
      linear-gradient(180deg,rgba(4,10,20,.18) 0%,rgba(4,10,20,.14) 28%,rgba(4,10,20,.82) 66%,rgba(3,7,17,.96) 100%),
      var(--scene) center 22%/cover no-repeat;filter:saturate(1.12)}
    .rank-card::after{content:"";position:absolute;inset:-1px;border-radius:32px;pointer-events:none;z-index:4;background:
      linear-gradient(135deg, rgba(var(--accent-rgb),.32), transparent 20%, transparent 76%, rgba(var(--accent-rgb),.18)),
      linear-gradient(90deg, transparent 18%, rgba(255,255,255,.13) 48%, transparent 54%);
      background-size:100% 100%,250% 100%;background-position:0 0,120% 0;mix-blend-mode:screen;animation:cardSweep 11s linear infinite}
    .rank-card.lspd{--accent:#53f0c4;--accent-rgb:83,240,196;--accent-soft:#35d49b;--scene:url('chiefs_assets/fone_lspd.png')}
    .rank-card.sfpd{--accent:#63b8ff;--accent-rgb:99,184,255;--accent-soft:#4d90f4;--scene:url('chiefs_assets/fone_sfpd.png')}
    .rank-card.lvpd{--accent:#ff5a9b;--accent-rgb:255,90,155;--accent-soft:#e44580;--scene:url('chiefs_assets/fone_lvpd.png')}
    .rank-card.top{--accent:#ffcf57;--accent-rgb:255,207,87;--accent-soft:#e8b948;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), inset 0 0 48px rgba(255,207,87,.12), 0 34px 90px rgba(0,0,0,.42), 0 0 44px rgba(255,194,58,.14)}
    .rank-card.top.lspd{--scene:url('chiefs_assets/fone_lspd.png')}
    .rank-card.top.sfpd{--scene:url('chiefs_assets/fone_sfpd.png')}
    .rank-card.top.lvpd{--scene:url('chiefs_assets/fone_lvpd.png')}
    .rank-card-body{position:relative;padding:28px 24px 18px;min-height:545px;display:flex;flex-direction:column}
    .rank-card-body::before{content:"";position:absolute;left:16px;right:16px;top:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.36),transparent)}

    .place-crown{position:absolute;top:-24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;min-width:128px;height:62px;padding:0 18px;border-radius:22px 22px 14px 14px;background:linear-gradient(180deg,rgba(255,215,113,.94),rgba(210,132,29,.88));color:#fff8dc;box-shadow:0 14px 28px rgba(0,0,0,.28),0 0 22px rgba(255,187,62,.24);font-size:16px;font-weight:1000;letter-spacing:.04em;text-transform:uppercase;z-index:7}
    .place-crown svg{position:absolute;top:-18px;left:50%;transform:translateX(-50%);width:38px;height:38px;fill:#ffdc76;filter:drop-shadow(0 4px 10px rgba(255,203,88,.48))}
    .place-badge{position:absolute;top:24px;left:20px;display:flex;align-items:center;justify-content:center;width:74px;height:74px;border-radius:22px;background:linear-gradient(160deg,rgba(8,17,39,.88),rgba(13,26,55,.82));border:1px solid rgba(var(--accent-rgb),.42);box-shadow:inset 0 0 26px rgba(var(--accent-rgb),.12)}
    .place-badge .medal{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 28%, rgba(255,255,255,.5), rgba(var(--accent-rgb),.16));border:2px solid rgba(var(--accent-rgb),.58);font-size:24px;font-weight:1000;text-shadow:0 0 12px rgba(var(--accent-rgb),.5)}
    .slot.first .place-badge{display:none}
    .dept-watermark{position:absolute;top:42px;right:22px;text-align:right;z-index:2}
    .dept-watermark strong{display:block;font-size:42px;font-weight:1000;letter-spacing:-.04em;text-shadow:0 0 22px rgba(var(--accent-rgb),.25)}
    .dept-watermark small{display:block;font-size:12px;font-weight:800;letter-spacing:.18em;color:rgba(245,250,255,.78);text-transform:uppercase}

    .dept-emblem{position:absolute;top:126px;right:18px;width:150px;height:150px;opacity:.93;display:grid;place-items:center;filter:drop-shadow(0 10px 22px rgba(0,0,0,.35))}
    .dept-emblem svg{width:100%;height:100%;fill:none;stroke:rgba(255,225,155,.88);stroke-width:1.8}
    .dept-emblem .ring{stroke:rgba(255,226,158,.86)}
    .dept-emblem .line{stroke:rgba(255,229,167,.82)}

    .character-strip{height:214px;border-radius:26px 26px 18px 18px;position:relative;overflow:hidden}
    .character-strip::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,14,28,.18),rgba(7,12,24,.12) 35%,rgba(5,11,24,.75) 100%)}

    .info-panel-card{margin-top:auto;position:relative;border-radius:24px;padding:18px;background:linear-gradient(180deg,rgba(7,17,36,.88),rgba(6,14,32,.95));border:1px solid rgba(var(--accent-rgb),.34);box-shadow:0 16px 34px rgba(0,0,0,.24), inset 0 0 24px rgba(var(--accent-rgb),.08);backdrop-filter:blur(10px)}
    .identity-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
    .chief-avatar{width:78px;height:78px;border-radius:22px;object-fit:cover;background:#10233c;border:2px solid rgba(var(--accent-rgb),.38);box-shadow:0 10px 22px rgba(0,0,0,.28)}
    .chief-name{font-size:clamp(28px,2.4vw,42px);font-weight:1000;line-height:1;letter-spacing:-.04em;margin:0 0 8px}
    .chief-id{font-size:16px;font-weight:900;color:rgba(var(--accent-rgb),1)}
    .dept-pill{display:inline-flex;align-items:center;justify-content:center;min-width:74px;height:32px;padding:0 14px;border-radius:999px;background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.36);font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
    .stat-main{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:end;margin-top:14px}
    .stat-main small{display:block;color:#9db6d5;font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    .stat-value{font-size:clamp(48px,4vw,68px);line-height:.92;font-weight:1000;letter-spacing:-.05em;color:var(--accent);text-shadow:0 0 22px rgba(var(--accent-rgb),.28)}
    .stat-value span{font-size:.5em;font-weight:900;margin-left:6px}
    .bars{display:flex;align-items:flex-end;gap:8px;height:64px;justify-content:flex-end}
    .bars i{display:block;width:14px;border-radius:10px 10px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.2), rgba(var(--accent-rgb),.96));box-shadow:0 0 14px rgba(var(--accent-rgb),.28)}
    .bars i:nth-child(1){height:20px;opacity:.68}.bars i:nth-child(2){height:34px;opacity:.8}.bars i:nth-child(3){height:52px;opacity:.92}
    .meta-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
    .meta-box{display:flex;align-items:center;gap:10px;min-height:66px;padding:12px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(7,18,39,.65),rgba(7,16,35,.9));border:1px solid rgba(var(--accent-rgb),.18)}
    .meta-box svg{width:20px;height:20px;flex-shrink:0;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .meta-box b{display:block;font-size:20px;line-height:1;font-weight:1000;color:var(--accent)}
    .meta-box span{display:block;font-size:10px;font-weight:800;color:#90abc9;letter-spacing:.14em;text-transform:uppercase;line-height:1.3}
    .activity-link{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;color:#cfe2fb;font-size:14px;font-weight:800}
    .activity-link svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.8}

    .pedestal{position:relative;margin:0 auto;z-index:-1;width:min(92%,420px);height:118px;border-radius:0 0 28px 28px;background:
      linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02) 18%,rgba(9,16,34,.88) 20%,rgba(8,16,34,.98) 100%),
      linear-gradient(90deg,rgba(var(--accent-rgb),.36),transparent 30%,transparent 70%,rgba(var(--accent-rgb),.36));
      border:1px solid rgba(var(--accent-rgb),.26);box-shadow:0 25px 40px rgba(0,0,0,.3), inset 0 0 18px rgba(var(--accent-rgb),.1)}
    .pedestal::before{content:"";position:absolute;left:16px;right:16px;top:10px;height:18px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.02));opacity:.75}
    .pedestal::after{content:"";position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:78%;height:26px;border-radius:999px;background:radial-gradient(circle at 50% 50%, rgba(var(--accent-rgb),.38), rgba(var(--accent-rgb),.06) 58%, transparent 80%);filter:blur(6px)}
    .pedestal-ring{position:absolute;left:50%;top:-32px;transform:translateX(-50%);width:110%;height:54px;border-radius:50%;border:1px solid rgba(var(--accent-rgb),.36);box-shadow:0 0 36px rgba(var(--accent-rgb),.22), inset 0 0 12px rgba(var(--accent-rgb),.18);background:radial-gradient(circle, rgba(var(--accent-rgb),.12), transparent 65%)}
    .pedestal-label{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:22px;font-weight:1000;letter-spacing:.06em;text-transform:uppercase;text-shadow:0 0 18px rgba(var(--accent-rgb),.28);white-space:nowrap}
    .slot.first .pedestal{height:138px}
    .slot.first .pedestal-label{font-size:30px;color:#ffe49b;text-shadow:0 0 18px rgba(255,207,87,.28)}
    .slot.first .pedestal-ring{border-color:rgba(255,207,87,.5);box-shadow:0 0 38px rgba(255,207,87,.22), inset 0 0 12px rgba(255,207,87,.18)}

    .analytics-grid{display:grid;grid-template-columns:1.1fr 1.2fr .9fr;gap:18px;margin-top:30px;padding-bottom:38px}
    .panel{position:relative;min-height:160px;padding:20px;border-radius:28px;background:linear-gradient(180deg,rgba(8,18,42,.78),rgba(7,15,34,.88));border:1px solid rgba(102,154,225,.18);box-shadow:0 16px 40px rgba(0,0,0,.24), inset 0 0 26px rgba(255,255,255,.02)}
    .panel-title{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#dce9fa;margin:0 0 18px}

      .rank-card,.rank-card-body{min-height:500px}

      .slot.second .float-shell:hover .rank-card,.slot.third .float-shell:hover .rank-card{transform:translateY(-4px) scale(1.01)}
    }
    @media(max-width:600px){
      .hero{padding-top:24px}.hero h1{font-size:clamp(30px,8.3vw,47px)}
      .rank-card,.rank-card-body{min-height:440px}.rank-card-body{padding:19px 15px 15px}
      .character-strip{height:160px}.dept-emblem{top:102px;width:103px;height:103px}
      .info-panel-card{padding:14px}.chief-avatar{width:62px;height:62px}
      .chief-name{font-size:clamp(20px,6.1vw,28px)}
      .podium-scene{padding-top:40px;gap:24px}
      .scene-shell{padding-inline:5px}
    }
    @media(prefers-reduced-motion:reduce){.float-shell{animation:none!important}.rank-card{transition:none}}

  </style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<div class="scanline" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute">
  <symbol id="ic-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></symbol>
  <symbol id="ic-chart" viewBox="0 0 24 24"><path d="M3 20h18"/><path d="M7 17V9"/><path d="M12 17V5"/><path d="M17 17v-7"/></symbol>
  <symbol id="ic-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></symbol>
  <symbol id="ic-refresh" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></symbol>
  <symbol id="ic-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 20v-1c0-4 3-7 7-7s7 3 7 7v1"/><path d="M17 11c2 0 4-2 4-4s-2-4-4-4"/><path d="M22 20v-1c0-3-2-5.7-5-6.6"/></symbol>
  <symbol id="ic-file" viewBox="0 0 24 24"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6M9 9h2"/></symbol>
  <symbol id="ic-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.4 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"/></symbol>
  <symbol id="ic-arrow" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m13 5 7 7-7 7"/></symbol>
  <symbol id="ic-crown" viewBox="0 0 24 24"><path d="m3 7 5 5 4-7 4 7 5-5-2 12H5z"/></symbol>
</svg>

<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="index.html" aria-label="Police Department — главная"><img src="pd_photo.png" alt=""><strong>POLICE DEPARTMENT</strong></a>
    <div class="right-tools"><div class="pd-header-user-slot" data-police-user-slot></div></div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-row">
      <div class="hero-left">
        <h1>АКТИВНОСТЬ <span>ШЕФОВ</span></h1>
      </div>
      <div class="hero-actions">
        <div class="period-toggle" role="group" aria-label="Период активности">
          <button type="button" data-period="day" aria-pressed="true">Сегодня</button>
          <button type="button" data-period="week" aria-pressed="false">Неделя</button>
        </div>
      </div>
    </div>
  </section>

  <section class="stage-section">
    <div class="scene-shell">
      <div class="background-sign left">LOS SANTOS<small>police department</small></div>
      <div class="background-sign center">SAN FIERRO<small>police department</small></div>
      <div class="background-sign right">LAS VENTURAS<small>police department</small></div>

      <p class="sr-only" id="apiStateText" role="status" aria-live="polite"></p>
      <div class="podium-scene" id="podiumScene" aria-label="Рейтинг шефов по активности">
        <div class="slot second" data-rank-slot="2"></div>
        <div class="slot first" data-rank-slot="1"></div>
        <div class="slot third" data-rank-slot="3"></div>
      </div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="wrap footer-inner">
    <p>© marsellex · С 2024 по настоящее время</p>
    <nav class="links" aria-label="Полезные ссылки">
      <a href="https://vk.com/marsellex" target="_blank" rel="noopener noreferrer">VK</a>
      <a href="https://t.me/marsellex1" target="_blank" rel="noopener noreferrer">Telegram</a>
      <a href="https://vk.com/absroleplay1script" target="_blank" rel="noopener noreferrer">World Script</a>
      <a href="https://vk.com/police_absone" target="_blank" rel="noopener noreferrer">Police Platinum</a>
      <a href="https://vk.com/melanie_hanter" target="_blank" rel="noopener noreferrer">Ответственная за полицию</a>
    </nav>
  </div>
</footer>
<div class="toast" id="toast" role="alert" aria-live="polite"></div>

<script>
(()=>{'use strict';
  const API='https://police-api-b2y4.onrender.com';
  const FALLBACK_AVATAR='png_police_site/profile.png';
  const DEPT={
    LSPD:{title:'LSPD',label:'Los Santos Police Department',city:'LOS SANTOS',cls:'lspd',accent:'#53f0c4'},
    SFPD:{title:'SFPD',label:'San Fierro Police Department',city:'SAN FIERRO',cls:'sfpd',accent:'#63b8ff'},
    LVPD:{title:'LVPD',label:'Las Venturas Police Department',city:'LAS VENTURAS',cls:'lvpd',accent:'#ff5a9b'}
  };
  const slots={1:document.querySelector('[data-rank-slot="1"]'),2:document.querySelector('[data-rank-slot="2"]'),3:document.querySelector('[data-rank-slot="3"]')};
  const toastNode=document.getElementById('toast');
  const stateText=document.getElementById('apiStateText');
  const periodButtons=[...document.querySelectorAll('[data-period]')];
  let items=[],period='day',controller=null,toastTimer=0;
  const htmlEscape=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const safeAvatar=v=>/^https:\/\//i.test(String(v||'')) ? String(v) : FALLBACK_AVATAR;
  const metric=(person,mode)=>{
    const candidates=mode==='day'
      ? [person?.activity_day,person?.day_activity,person?.metric_day,person?.stats?.day]
      : [person?.activity_week,person?.week_activity,person?.metric_week,person?.stats?.week];
    for(const value of candidates){
      if(value===null||value===undefined||value==='')continue;
      const number=Number(value);
      if(Number.isFinite(number)&&number>=0)return number;
    }
    return null;
  };
  function showToast(message){toastNode.textContent=message;toastNode.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastNode.classList.remove('visible'),4200)}
  function status(message){stateText.textContent=message;}
  function shield(){return `<svg viewBox="0 0 160 160" aria-hidden="true"><circle class="ring" cx="80" cy="80" r="70"/><circle class="ring" cx="80" cy="80" r="58"/><path class="line" d="M46 110h68M60 100 80 56l20 44M80 56v54M55 42h50M44 50c12-9 25-14 36-14 16 0 29 6 36 14M52 119c17 9 39 9 56 0M31 80h16M113 80h16"/></svg>`}
  function card(person,rank,rankReady){
    const info=DEPT[person.department];
    const value=metric(person,period);
    const isFirst=rank===1;
    const label=rankReady?`${rank} МЕСТО`:'';
    const badge=!rankReady?'':isFirst
      ? `<div class="place-crown"><svg viewBox="0 0 24 24"><use href="#ic-crown"/></svg>1 МЕСТО</div>`
      : `<div class="place-badge"><div class="medal">${rank}</div></div>`;
    const avatar=safeAvatar(person.avatar_url);
    const score=value===null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(value);
    return `<div class="card-wrap ${info.cls}${isFirst?' rank-one':''}"><div class="float-shell"><article class="rank-card ${info.cls}${isFirst?' top':''}" aria-label="${info.title}, ${rankReady?'место '+rank:'ожидается рейтинг'}">
      ${badge}
      <div class="rank-card-body">
        <div class="dept-watermark"><strong>${info.title}</strong><small>${info.city}</small></div>
        <div class="dept-emblem">${shield()}</div>
        <div class="character-strip"></div>
        <div class="info-panel-card">
          <div class="identity-row">
            <img class="chief-avatar" alt="Аватар ${htmlEscape(person.nickname||info.title)}" src="${htmlEscape(avatar)}">
            <div><div class="chief-name">${htmlEscape(person.nickname||'Не назначен')}</div>
              <div class="chief-id">${person.account_number?'['+htmlEscape(person.account_number)+']':''}</div>
              <span class="dept-pill">${info.title}</span>
            </div>
          </div>
          <div class="stat-main"><div><small>${period==='day'?'Активность за день':'Активность за неделю'}</small><div class="stat-value">${score}<span>АШ</span></div>${value===null?'<div class="stat-note">Данные ещё не подключены</div>':''}</div><div class="bars" aria-hidden="true"><i></i><i></i><i></i></div></div>
        </div>
      </div>
    </article></div><div class="pedestal"><div class="pedestal-ring"></div><div class="pedestal-label">${label}</div></div></div>`;
  }
  function render(){
    const byDept=Object.fromEntries(['LSPD','SFPD','LVPD'].map(dept=>[dept,{department:dept,...(items.find(x=>String(x.department||'').toUpperCase()===dept)||{})}]));
    const all=[byDept.LSPD,byDept.SFPD,byDept.LVPD];
    const hasRank=all.every(x=>!!String(x.nickname||'').trim()&&metric(x,period)!==null);
    const ordered=hasRank
      ? [...all].sort((a,b)=>metric(b,period)-metric(a,period)||a.department.localeCompare(b.department))
      : [byDept.SFPD,byDept.LSPD,byDept.LVPD];
    for(let i=0;i<ordered.length;i++){
      const slot=i+1;slots[slot].innerHTML=card(ordered[i],slot,hasRank);
      const avatar=slots[slot].querySelector('.chief-avatar');
      avatar.onerror=()=>{avatar.onerror=null;avatar.src=FALLBACK_AVATAR};
    }
  }
  async function refresh(){
    controller?.abort();const next=new AbortController();controller=next;status('Обновляем данные...');
    const timeout=setTimeout(()=>next.abort(),12000);
    try{
      const res=await fetch(API+'/api/portal/chiefs',{headers:{Accept:'application/json'},cache:'no-store',signal:next.signal});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      if(!data||data.ok!==true||!Array.isArray(data.items))throw new Error('Неверный ответ сервера');
      if(controller!==next)return;
      items=data.items;render();status('Данные руководства получены');
    }catch(err){
      if(controller!==next)return;
      console.warn('[Police] Chiefs refresh:',err);
      status('Временная ошибка соединения');showToast('Не удалось получить данные руководства.');
    }finally{clearTimeout(timeout);if(controller===next){controller=null}}
  }
  periodButtons.forEach(btn=>btn.addEventListener('click',()=>{period=btn.dataset.period;periodButtons.forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));render()}));
  window.addEventListener('pageshow',event=>{if(event.persisted)refresh()});
  render();refresh();
})();
</script>
</body>
</html>
