<main><div class="wrap center-shell"><div class="inline-zone"><section id="authBox"><div class="inline-tabs"><button class="tab active" id="tabLogin" type="button">Войти</button><button class="tab" id="tabRegister" type="button">Зарегистрироваться</button></div><form class="inline-form" id="loginForm"><div class="field"><label for="login">Логин</label><input name="login" id="login" required minlength="3" maxlength="32" autocomplete="username" placeholder="Логин"></div><div class="field"><label for="password">Пароль</label><input name="password" id="password" type="password" required autocomplete="current-password" placeholder="Пароль"></div><button type="submit" class="btn primary full">Войти</button></form><form class="inline-form hide" id="registerForm"><div class="field"><label for="registerLogin">Логин</label><input id="registerLogin" required pattern="[a-zA-Z0-9_.-]{3,32}" minlength="3" maxlength="32" autocomplete="username" placeholder="Логин латиницей"></div><div class="field"><label for="registerNick">Игровой ник</label><input id="registerNick" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="Имя_Фамилия"></div><div class="field"><label for="registerDept">Департамент</label><select id="registerDept" required><option value="LSPD">LSPD</option><option value="SFPD">SFPD</option><option value="LVPD">LVPD</option></select></div><div class="field"><label for="registerBank">Номер банковского счёта</label><input id="registerBank" required pattern="[0-9]{1,20}" maxlength="20" inputmode="numeric" placeholder="Номер счёта"></div><div class="field"><label for="registerPassword">Пароль</label><input id="registerPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="Не менее 8 символов"></div><button type="submit" class="btn primary full">Создать аккаунт</button></form><div class="error" id="authError" role="alert"></div><div class="ok" id="authSuccess"></div></section><section class="hide" id="cabinet"><div class="profile-inline"><div><div class="identity-name" id="displayNick"></div><div class="identity-role" id="displayRole"></div></div><button class="btn sm" id="logout" type="button">Выйти</button></div><div id="noRole" class="surface"><p class="minimal">Доступ пока не назначен.</p><details class="details"><summary>Первый администратор</summary><form id="bootstrapForm" class="inline-form" style="margin-top:14px"><div class="field"><label for="bootstrapToken">Код активации</label><input id="bootstrapToken" type="password" autocomplete="off" required placeholder="Код"></div><button type="submit" class="btn">Активировать</button></form></details></div><div id="manager" class="hide"><div class="inline-manager"><div class="row"><div class="field"><label for="searchUser">Сотрудник</label><input id="searchUser" autocomplete="off" placeholder="Поиск по логину" maxlength="32"></div><button class="btn" type="button" id="findUser">Найти</button></div><div id="userResults"></div><div class="triple"><div class="field"><label for="assignRole">Роль</label><select id="assignRole"></select></div><div class="field"><label for="assignDept">Департамент</label><select id="assignDept"><option value="LSPD">LSPD</option><option value="SFPD">SFPD</option><option value="LVPD">LVPD</option></select></div><button class="btn primary" id="assignBtn" type="button" disabled>Назначить</button></div><div class="notice" id="candidateInfo"></div><button class="btn sm warn hide" id="revokeBtn" type="button">Снять роль</button></div></div><div class="error" id="actionError" role="alert"></div><div class="ok" id="actionSuccess"></div></section></div></div></main><div class="toast-zone" id="toastZone" aria-live="polite"></div><footer class="footer"><div class="wrap footin"><span>© marsellex · С 2024 по настоящее время</span><a href="index.html">К реестру</a></div></footer>
<script>
(()=>{'use strict';
const API='https://police-api-b2y4.onrender.com';const $=id=>document.getElementById(id);const KEY='pd_site_token';
let token=sessionStorage.getItem(KEY),user=null,selected=null,searchItems=[];
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roleLabels={admin:'Администратор',minister:'Министр',leader:'Лидер',senior:'Старший состав'};
function toast(message,bad=false){const root=$('toastZone');if(!root)return;const node=document.createElement('div');node.className='toast'+(bad?' bad':'');node.textContent=message;root.appendChild(node);requestAnimationFrame(()=>node.classList.add('show'));setTimeout(()=>{node.classList.remove('show');node.classList.add('hide');setTimeout(()=>node.remove(),260);},3600);}
async function api(path,options={}){const h={'Accept':'application/json'};if(options.body!==undefined)h['Content-Type']='application/json';if(options.auth!==false&&token)h.Authorization='Bearer '+token;const res=await fetch(API+path,{method:options.method||'GET',headers:h,body:options.body!==undefined?JSON.stringify(options.body):undefined,cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw Object.assign(new Error(data.error||'Ошибка'),{status:res.status});return data;}
function error(id,text){$(id).textContent=text;}function clear(){['authError','authSuccess','actionError','actionSuccess'].forEach(x=>error(x,''));}
function failure(e){return e.status===401?'Проверь логин и пароль':e.status===403?'Недостаточно прав':e.status===409?'Проверь данные и повтори':'Не удалось выполнить действие';}
function tab(which){clear();$('tabLogin').classList.toggle('active',which==='login');$('tabRegister').classList.toggle('active',which==='register');$('loginForm').classList.toggle('hide',which!=='login');$('registerForm').classList.toggle('hide',which!=='register');}
$('tabLogin').onclick=()=>{location.hash='login';tab('login');};$('tabRegister').onclick=()=>{location.hash='register';tab('register');};
$('registerForm').onsubmit=async e=>{e.preventDefault();clear();const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;try{await api('/api/auth/register',{method:'POST',auth:false,body:{login:$('registerLogin').value.trim().toLowerCase(),nickname:$('registerNick').value.trim(),password:$('registerPassword').value,department:$('registerDept').value,bank_account:$('registerBank').value.trim()}});$('registerForm').reset();tab('login');error('authSuccess','');toast('Аккаунт создан');}catch(x){const msg=x.status===409?'Логин занят':failure(x);error('authError',msg);toast(msg,true);}finally{btn.disabled=false;}};
$('loginForm').onsubmit=async e=>{e.preventDefault();clear();const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;try{const data=await api('/api/auth/login',{method:'POST',auth:false,body:{login:$('login').value.trim(),password:$('password').value}});token=data.session_token;sessionStorage.setItem(KEY,token);$('password').value='';await refreshMe();toast('Вход выполнен');}catch(x){const msg=failure(x);error('authError',msg);toast(msg,true);}finally{btn.disabled=false;}};
$('logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});}catch{}token=null;user=null;sessionStorage.removeItem(KEY);selected=null;showAuth();toast('Вы вышли');};
function showAuth(){$('authBox').classList.remove('hide');$('cabinet').classList.add('hide');$('topAccount').textContent='Войти';$('topAccount').href='#login';}
async function refreshMe(){if(!token){showAuth();return;}try{const r=await api('/api/auth/me');user=r.user;renderCabinet();}catch{token=null;sessionStorage.removeItem(KEY);user=null;showAuth();}}
function renderCabinet(){clear();$('authBox').classList.add('hide');$('cabinet').classList.remove('hide');$('topAccount').textContent='Кабинет';$('topAccount').href='#manage';$('displayNick').textContent=user.nickname||user.login;$('displayRole').textContent=(roleLabels[user.role]||'Пользователь')+(user.role_department&&user.role_department!=='ALL'?' · '+user.role_department:'');const manager=['admin','minister'].includes(user.role);$('noRole').classList.toggle('hide',manager||!!user.role);$('manager').classList.toggle('hide',!manager);if(manager){setupRoles();}}
function setupRoles(){const vals=user.role==='admin'?[['minister','Министр'],['leader','Лидер'],['senior','Старший состав']]:[['leader','Лидер'],['senior','Старший состав']];$('assignRole').innerHTML=vals.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');$('assignRole').onchange=()=>{$('assignDept').disabled=$('assignRole').value==='minister';if($('assignRole').value==='minister')$('assignDept').value='LSPD';};$('assignRole').onchange();selected=null;$('assignBtn').disabled=true;$('userResults').innerHTML='';$('candidateInfo').textContent='';$('revokeBtn').classList.add('hide');}
$('findUser').onclick=async()=>{clear();selected=null;$('revokeBtn').classList.add('hide');$('assignBtn').disabled=true;const q=$('searchUser').value.trim().toLowerCase();if(!/^[a-z0-9_.-]{2,32}$/.test(q)){$('userResults').textContent='Укажи логин';return;}try{const data=await api('/api/roles/users?search='+encodeURIComponent(q));searchItems=data.items||[];renderSearch();}catch(x){const msg=failure(x);error('actionError',msg);toast(msg,true);}};
function renderSearch(){$('userResults').innerHTML=searchItems.length?searchItems.map(p=>`<div class="surface candidate"><span><strong>${escapeHtml(p.nickname)}</strong><small>${escapeHtml(p.login)}${p.role?' · '+escapeHtml(roleLabels[p.role])+(p.department&&p.department!=='ALL'?' '+escapeHtml(p.department):''):''}</small></span><button class="btn sm" type="button" data-select="${escapeHtml(p.id)}">Выбрать</button></div>`).join(''):'<p class="minimal">Данных нет</p>';}
$('userResults').onclick=e=>{const b=e.target.closest('[data-select]');if(!b)return;selected=searchItems.find(x=>x.id===b.dataset.select)||null;$('assignBtn').disabled=!selected||!!selected.role;$('candidateInfo').textContent=selected?(selected.role?'Роль уже назначена':'Выбран: '+selected.nickname):'';const canRevoke=selected&&selected.role&&selected.id!==user.id&&selected.role!=='admin'&&((user.role==='admin')||(user.role==='minister'&&['leader','senior'].includes(selected.role)));$('revokeBtn').classList.toggle('hide',!canRevoke);};
$('assignBtn').onclick=async()=>{if(!selected||selected.role)return;clear();const role=$('assignRole').value,department=role==='minister'?'ALL':$('assignDept').value;$('assignBtn').disabled=true;try{await api('/api/roles/assign',{method:'POST',body:{target_id:selected.id,role,department}});selected=null;$('findUser').click();error('actionSuccess','');toast('Роль назначена');}catch(x){const msg=x.status===502?'Роль уже назначена':failure(x);error('actionError',msg);toast(msg,true);}finally{$('assignBtn').disabled=!selected;}};
$('revokeBtn').onclick=async()=>{if(!selected||!selected.role||!confirm('Снять роль с '+selected.nickname+'?'))return;clear();$('revokeBtn').disabled=true;try{await api('/api/roles/revoke',{method:'POST',body:{target_id:selected.id}});$('revokeBtn').classList.add('hide');selected=null;$('findUser').click();error('actionSuccess','');toast('Роль снята');}catch(x){const msg=failure(x);error('actionError',msg);toast(msg,true);}finally{$('revokeBtn').disabled=false;}};
$('bootstrapForm').onsubmit=async e=>{e.preventDefault();clear();const code=$('bootstrapToken').value;$('bootstrapToken').value='';try{await api('/api/site/bootstrap',{method:'POST',body:{bootstrap_token:code}});await refreshMe();error('actionSuccess','');toast('Доступ открыт');}catch(x){const msg=x.status===409?'Администратор уже назначен':failure(x);error('actionError',msg);toast(msg,true);}};
window.addEventListener('hashchange',()=>{if(!user)tab(location.hash==='#register'?'register':'login');});
window.addEventListener('load',()=>setTimeout(()=>$('loader').classList.add('hide'),420));
tab(location.hash==='#register'?'register':'login');refreshMe();
})();
</script></body></html>
