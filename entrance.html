<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07121e">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Личный кабинет Police Department">
  <title>Реестр</title>
  <link rel="icon" type="image/png" href="pd_photo.png">
  <style>
:root{color-scheme:dark;--ink:#eef8ff;--muted:#8ba9c0;--stroke:rgba(130,191,232,.2);--light:#78caff;--red:#f37894;--shadow:0 18px 58px rgba(0,8,19,.35)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font:14px/1.55 Inter,"Segoe UI",Arial,sans-serif;background:radial-gradient(ellipse 60% 40% at 84% 15%,rgba(28,103,163,.22),transparent 75%),radial-gradient(ellipse 44% 48% at 12% 76%,rgba(24,85,132,.17),transparent 80%),linear-gradient(145deg,#081726,#0a1a2a 46%,#06111c);-webkit-font-smoothing:antialiased}body::before,body::after{content:"";position:fixed;z-index:-2;border-radius:50%;pointer-events:none;filter:blur(65px);animation:drift 24s ease-in-out infinite alternate}body::before{width:55vw;aspect-ratio:1;max-width:640px;top:-24vh;right:-12vw;background:radial-gradient(circle,rgba(60,156,225,.19),transparent 70%)}body::after{width:47vw;aspect-ratio:1;max-width:580px;bottom:-26vh;left:-12vw;background:radial-gradient(circle,rgba(215,74,112,.085),transparent 68%);animation-direction:alternate-reverse}.grid-noise{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.3;background-image:linear-gradient(rgba(122,184,226,.027) 1px,transparent 1px),linear-gradient(90deg,rgba(122,184,226,.027) 1px,transparent 1px);background-size:68px 68px;mask-image:linear-gradient(#000a,transparent 83%)}.wrap{width:min(1180px,calc(100% - 58px));margin:0 auto}.hide,[hidden]{display:none!important}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}a{color:inherit;text-decoration:none}
.header{height:88px;position:sticky;top:0;z-index:30;border-bottom:1px solid rgba(124,185,231,.24);backdrop-filter:blur(18px);background-image:linear-gradient(90deg,rgba(4,15,25,.78),rgba(6,19,30,.53) 42%,rgba(5,15,25,.76)),url('reestr_shapk.png');background-repeat:no-repeat;background-size:100% 100%,100% 100%;box-shadow:0 9px 36px rgba(1,7,15,.23)}.header::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,rgba(93,193,255,.48) 16%,rgba(232,115,147,.38) 54%,rgba(95,188,255,.53) 87%,transparent)}.top-inner{height:100%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:14px;letter-spacing:.13em;text-shadow:0 3px 18px #000b}.brand img{width:37px;height:43px;object-fit:contain;filter:drop-shadow(0 4px 12px #5caafc44)}.nav{display:flex;gap:18px;align-items:center}.nav a{font-size:12px;color:#d0e8fa;position:relative;padding:10px 0;transition:color .23s}.nav a::after{content:"";position:absolute;left:0;right:0;bottom:3px;height:2px;border-radius:2px;transform:scaleX(0);background:linear-gradient(90deg,#61b6f1,#ed9ab1);transition:transform .28s}.nav a:hover{color:white}.nav a:hover::after{transform:scaleX(1)}
main{padding:42px 0 76px}.center-shell{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 205px)}.inline-zone{width:min(690px,100%);animation:reveal .66s ease both}.inline-tabs{display:flex;gap:11px;justify-content:center;margin-bottom:25px}.tab,.btn,.surface{position:relative;overflow:hidden;isolation:isolate;transition:transform .24s,border-color .24s,box-shadow .24s,background .24s}.tab::after,.btn::after,.surface::after{content:"";position:absolute;inset:0;left:-150%;background:linear-gradient(95deg,transparent 15%,rgba(255,255,255,.015) 35%,rgba(171,224,255,.17) 50%,transparent 70%);opacity:0;pointer-events:none}.tab:hover::after,.btn:hover::after,.surface:hover::after{opacity:1;animation:lightSweep 3s linear infinite}.tab{min-width:175px;padding:13px 18px;background:rgba(22,47,66,.58);color:#b5d2e5;border:1px solid var(--stroke);border-radius:12px;box-shadow:var(--shadow);font-size:13px;font-weight:810}.tab:hover{transform:translateY(-2px);border-color:#8dd3ff77}.tab.active{color:#f5fbff;border-color:#7cc5fa88;background:linear-gradient(135deg,#23587999,#0f304ab0);box-shadow:inset 0 -2px #78c8fc88,var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:12px 19px;background:linear-gradient(180deg,rgba(36,75,106,.54),rgba(14,36,54,.7));border:1px solid var(--stroke);border-radius:12px;color:#e7f6ff;font-size:12px;font-weight:800;box-shadow:var(--shadow)}.btn::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,#76c9ff,#e3f5ff,#7babff);transform:scaleY(.05);transform-origin:center;opacity:0;transition:transform .27s,opacity .27s;z-index:1}.btn:hover:not(:disabled){transform:translateY(-2px);border-color:rgba(123,205,255,.6);box-shadow:0 15px 40px #0006,0 0 22px #52a5e31e}.btn:hover::before,.btn:focus-visible::before{opacity:1;transform:scaleY(1)}.btn.primary{background:linear-gradient(135deg,#3b89bd,#246491);border-color:#94d9ff7d;color:#fff}.btn.warn{background:linear-gradient(135deg,#7c324c,#531c2e);border-color:#df7c9a80}.btn.sm{min-height:36px;padding:9px 13px}.btn.full{width:100%}
.inline-form,.inline-manager{display:grid;gap:17px}.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}.triple{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:end}.field{min-width:0}.field label{display:block;color:#aad0ea;font-size:11px;font-weight:810;margin-bottom:8px;letter-spacing:.035em}.field input,.field select{height:52px;width:100%;border:1px solid rgba(139,193,234,.24);border-radius:12px;background:rgba(8,26,43,.7);outline:none;color:#edf9ff;padding:0 14px;transition:border-color .24s,box-shadow .24s}.field input::placeholder{color:#7196b1}.field input:focus,.field select:focus{border-color:#85caff;box-shadow:0 0 0 3px #5db5eb1c}
.profile-inline{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--stroke);padding:0 0 24px;margin-bottom:25px}.identity-name{font-size:clamp(26px,3vw,38px);font-weight:870;line-height:1.15;letter-spacing:-.055em}.identity-role,.minimal,.muted,.notice{color:#8eacc3;font-size:12px;line-height:1.8}.identity-role{margin-top:7px}.surface{background:linear-gradient(155deg,rgba(30,65,87,.37),rgba(11,29,46,.57));border:1px solid var(--stroke);border-radius:15px;padding:17px 18px;box-shadow:var(--shadow);margin-bottom:11px;animation:gentleFloat 9s ease-in-out infinite}.surface:nth-child(even){animation-delay:-2s}.surface:hover{transform:translateY(-3px);border-color:#80c9f55e;box-shadow:0 18px 50px #03101f82,0 0 25px #54a8e515}.candidate,.request{display:flex;justify-content:space-between;gap:12px;align-items:center}.candidate strong,.request strong{display:block;color:#f0f8ff;font-size:13px}.candidate small,.request small{display:block;color:#96b8cf;font-size:11px;margin-top:5px}.request-actions{display:flex;gap:9px;flex-wrap:wrap}.notice{margin:0}.error,.ok{min-height:18px;margin-top:10px;font-size:12px}.error{color:#ffb1c2}.ok{color:#9aecc7}.details{margin-top:11px}.details summary{cursor:pointer;color:#b4d9f0;font-size:12px}.footer{border-top:1px solid var(--stroke);padding:23px 0 35px;color:#86a3b8;font-size:11px}.footin{display:flex;align-items:center;justify-content:space-between;gap:14px}.footin a:hover{color:#d7f3ff}
.toast-zone{position:fixed;top:22px;right:22px;z-index:130;display:flex;flex-direction:column;gap:10px;pointer-events:none}.toast{min-width:230px;max-width:370px;padding:14px 18px;border:1px solid #79c7f477;border-radius:12px;background:#102f45f5;color:#e5f7ff;box-shadow:0 20px 45px #02101dc1;transform:translateX(35px);opacity:0;transition:transform .29s,opacity .29s;pointer-events:auto;font-weight:750;font-size:12px}.toast.show{transform:translateX(0);opacity:1}.toast.hide{transform:translateX(27px);opacity:0}.toast.bad{background:#3f1f2df5;border-color:#eb99ad77;color:#ffe1e9}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-7vw,6vh)}}@keyframes lightSweep{0%{transform:translateX(0)}100%{transform:translateX(300%)}}@keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}@keyframes gentleFloat{0%,100%{translate:0 0}50%{translate:0 -3px}}
@media(max-width:760px){.wrap{width:calc(100% - 32px)}.header{height:74px}.brand{font-size:11px;letter-spacing:.08em}.brand img{width:28px;height:32px}.nav{gap:12px}.nav a{font-size:11px}main{padding:34px 0 57px}.center-shell{min-height:calc(100vh - 180px)}.inline-tabs{justify-content:stretch}.tab{min-width:0;flex:1;padding:12px 10px}.row,.triple{grid-template-columns:1fr}.profile-inline{align-items:start;flex-direction:column}.candidate,.request{align-items:start;flex-direction:column}.footer .footin{flex-direction:column;align-items:start}.toast-zone{left:12px;right:12px;top:12px}.toast{min-width:0;max-width:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body><div class="grid-noise" aria-hidden="true"></div><header class="header"><div class="wrap top-inner"><a class="brand" href="index.html"><img src="pd_photo.png" alt=""> POLICE DEPARTMENT</a><nav class="nav"><a href="index.html">Реестр</a><a href="#login" id="topAccount">Войти</a></nav></div></header><div class="police-ribbon" aria-hidden="true"></div>
<main><div class="wrap center-shell"><div class="inline-zone"><section id="authBox"><div class="inline-tabs"><button class="tab active" id="tabLogin" type="button">Войти</button><button class="tab" id="tabRegister" type="button">Зарегистрироваться</button></div><form class="inline-form" id="loginForm"><div class="field"><label for="login">Логин</label><input name="login" id="login" required minlength="3" maxlength="32" autocomplete="username" placeholder="Логин"></div><div class="field"><label for="password">Пароль</label><input name="password" id="password" type="password" required autocomplete="current-password" placeholder="Пароль"></div><button type="submit" class="btn primary full">Войти</button></form><form class="inline-form hide" id="registerForm"><div class="field"><label for="registerLogin">Логин</label><input id="registerLogin" required pattern="[a-zA-Z0-9_.-]{3,32}" minlength="3" maxlength="32" autocomplete="username" placeholder="Логин латиницей"></div><div class="field"><label for="registerNick">Игровой ник</label><input id="registerNick" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}" placeholder="Имя_Фамилия"></div><div class="field"><label for="registerDept">Департамент</label><select id="registerDept" required><option value="LSPD">LSPD</option><option value="SFPD">SFPD</option><option value="LVPD">LVPD</option></select></div><div class="field"><label for="registerBank">Номер банковского счёта</label><input id="registerBank" required pattern="[0-9]{1,20}" maxlength="20" inputmode="numeric" placeholder="Номер счёта"></div><div class="field"><label for="registerPassword">Пароль</label><input id="registerPassword" type="password" minlength="8" maxlength="72" required autocomplete="new-password" placeholder="Не менее 8 символов"></div><button type="submit" class="btn primary full">Создать аккаунт</button></form><div class="error" id="authError" role="alert"></div><div class="ok" id="authSuccess"></div></section><section class="hide" id="cabinet"><div class="profile-inline"><div><div class="identity-name" id="displayNick"></div><div class="identity-role" id="displayRole"></div></div><button class="btn sm" id="logout" type="button">Выйти</button></div><div id="noRole" class="surface"><p class="minimal">Доступ пока не назначен.</p><details class="details"><summary>Первый администратор</summary><form id="bootstrapForm" class="inline-form" style="margin-top:14px"><div class="field"><label for="bootstrapToken">Код активации</label><input id="bootstrapToken" type="password" autocomplete="off" required placeholder="Код"></div><button type="submit" class="btn">Активировать</button></form></details></div><div id="manager" class="hide"><details class="details hide" id="developerBootstrap"><summary>Роль разработчика</summary><form class="inline-form" id="developerBootstrapForm" style="margin-top:14px"><div class="field"><label for="developerBootstrapToken">Код активации</label><input id="developerBootstrapToken" type="password" autocomplete="off" required placeholder="Код"></div><button class="btn" type="submit">Активировать</button></form></details><div class="inline-manager"><div class="row"><div class="field"><label for="searchUser">Сотрудник</label><input id="searchUser" autocomplete="off" placeholder="Поиск по логину" maxlength="32"></div><button class="btn" type="button" id="findUser">Найти</button></div><div id="userResults"></div><div class="triple"><div class="field"><label for="assignRole">Роль</label><select id="assignRole"></select></div><div class="field"><label for="assignDept">Департамент</label><select id="assignDept"><option value="LSPD">LSPD</option><option value="SFPD">SFPD</option><option value="LVPD">LVPD</option></select></div><button class="btn primary" id="assignBtn" type="button" disabled>Назначить</button></div><div class="notice" id="candidateInfo"></div><button class="btn sm warn hide" id="revokeBtn" type="button">Снять роль</button></div></div><div class="error" id="actionError" role="alert"></div><div class="ok" id="actionSuccess"></div></section></div></div></main><div class="toast-zone" id="toastZone" aria-live="polite"></div><footer class="footer"><div class="wrap footin"><span>© marsellex · С 2024 по настоящее время</span><a href="index.html">К реестру</a></div></footer>
<script>
(()=>{'use strict';
const API='https://api.police-department.ru';const $=id=>document.getElementById(id);const KEY='pd_site_token';
let token=sessionStorage.getItem(KEY),user=null,selected=null,searchItems=[];
const escapeHtml=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roleLabels={developer:'Разработчик',admin:'Администратор',minister:'Министр',leader:'Лидер',senior:'Старший состав'};
function toast(message,bad=false){const root=$('toastZone');if(!root)return;const node=document.createElement('div');node.className='toast'+(bad?' bad':'');node.textContent=message;root.appendChild(node);requestAnimationFrame(()=>node.classList.add('show'));setTimeout(()=>{node.classList.remove('show');node.classList.add('hide');setTimeout(()=>node.remove(),260);},3600);}
async function api(path,options={}){const h={'Accept':'application/json'};if(options.body!==undefined)h['Content-Type']='application/json';if(options.auth!==false&&token)h.Authorization='Bearer '+token;const res=await fetch(API+path,{method:options.method||'GET',headers:h,body:options.body!==undefined?JSON.stringify(options.body):undefined,cache:'no-store'});const data=await res.json().catch(()=>({}));if(!res.ok)throw Object.assign(new Error(data.error||'Ошибка'),{status:res.status});return data;}
function error(id,text){$(id).textContent=text;}function clear(){['authError','authSuccess','actionError','actionSuccess'].forEach(x=>error(x,''));}
function failure(e){return e.status===401?'Проверь логин и пароль':e.status===403?'Недостаточно прав':e.status===409?'Проверь данные и повтори':'Не удалось выполнить действие';}
function tab(which){clear();$('tabLogin').classList.toggle('active',which==='login');$('tabRegister').classList.toggle('active',which==='register');$('loginForm').classList.toggle('hide',which!=='login');$('registerForm').classList.toggle('hide',which!=='register');}
$('tabLogin').onclick=()=>{location.hash='login';tab('login');};$('tabRegister').onclick=()=>{location.hash='register';tab('register');};
$('registerForm').onsubmit=async e=>{e.preventDefault();clear();const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;try{await api('/api/auth/register',{method:'POST',auth:false,body:{login:$('registerLogin').value.trim().toLowerCase(),nickname:$('registerNick').value.trim(),password:$('registerPassword').value,department:$('registerDept').value,bank_account:$('registerBank').value.trim()}});$('registerForm').reset();tab('login');error('authSuccess','');toast('Аккаунт создан');}catch(x){const msg=x.status===409?'Логин занят':failure(x);error('authError',msg);toast(msg,true);}finally{btn.disabled=false;}};
$('loginForm').onsubmit=async e=>{e.preventDefault();clear();const btn=e.target.querySelector('button[type="submit"]');btn.disabled=true;try{const data=await api('/api/auth/login',{method:'POST',auth:false,body:{login:$('login').value.trim(),password:$('password').value}});token=data.session_token;sessionStorage.setItem(KEY,token);$('password').value='';await refreshMe();toast('Вход выполнен');}catch(x){const msg=failure(x);error('authError',msg);toast(msg,true);}finally{btn.disabled=false;}};
$('logout').onclick=async()=>{try{await api('/api/auth/logout',{method:'POST'});}catch{}token=null;user=null;sessionStorage.removeItem(KEY);selected=null;showAuth();toast('Вы вышли');};
function showAuth(){$('authBox').classList.remove('hide');$('cabinet').classList.add('hide');$('topAccount').textContent='Войти';$('topAccount').href='#login';}
async function refreshMe(){if(!token){showAuth();return;}try{const r=await api('/api/auth/me');user=r.user;renderCabinet();}catch{token=null;sessionStorage.removeItem(KEY);user=null;showAuth();}}
function renderCabinet(){clear();$('authBox').classList.add('hide');$('cabinet').classList.remove('hide');$('topAccount').textContent='Кабинет';$('topAccount').href='#manage';$('displayNick').textContent=user.nickname||user.login;$('displayRole').textContent=(roleLabels[user.role]||'Пользователь')+(user.role_department&&user.role_department!=='ALL'?' · '+user.role_department:'');const manager=['developer','admin','minister'].includes(user.role);$('developerBootstrap').classList.toggle('hide',user.role!=='admin');$('noRole').classList.toggle('hide',manager||!!user.role);$('manager').classList.toggle('hide',!manager);if(manager){setupRoles();}}
function setupRoles(){
const vals=user.role==='developer'
 ?[['developer','Разработчик'],['admin','Администратор'],['minister','Министр'],['leader','Лидер'],['senior','Старший состав']]
 :user.role==='admin'?[['minister','Министр'],['leader','Лидер'],['senior','Старший состав']]
 :[['leader','Лидер'],['senior','Старший состав']];
$('assignRole').innerHTML=vals.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');
$('assignRole').onchange=()=>{const elevated=['developer','admin','minister'].includes($('assignRole').value);$('assignDept').disabled=elevated;};
$('assignRole').onchange();selected=null;$('assignBtn').disabled=true;$('userResults').innerHTML='';$('candidateInfo').textContent='';$('revokeBtn').classList.add('hide');
}
$('findUser').onclick=async()=>{clear();selected=null;$('revokeBtn').classList.add('hide');$('assignBtn').disabled=true;const q=$('searchUser').value.trim().toLowerCase();if(!/^[a-z0-9_.-]{2,32}$/.test(q)){$('userResults').textContent='Укажи логин';return;}try{const data=await api('/api/roles/users?search='+encodeURIComponent(q));searchItems=data.items||[];renderSearch();}catch(x){const msg=failure(x);error('actionError',msg);toast(msg,true);}};
function renderSearch(){$('userResults').innerHTML=searchItems.length?searchItems.map(p=>`<div class="surface candidate"><span><strong>${escapeHtml(p.nickname)}</strong><small>${escapeHtml(p.login)}${p.role?' · '+escapeHtml(roleLabels[p.role])+(p.department&&p.department!=='ALL'?' '+escapeHtml(p.department):''):''}</small></span><button class="btn sm" type="button" data-select="${escapeHtml(p.id)}">Выбрать</button></div>`).join(''):'<p class="minimal">Данных нет</p>';}
$('userResults').onclick=e=>{
const b=e.target.closest('[data-select]');if(!b)return;
selected=searchItems.find(x=>x.id===b.dataset.select)||null;
const developer=user?.role==='developer';
const self=selected?.id===user?.id;
$('assignBtn').disabled=!selected||self||(!developer&&!!selected.role);
$('candidateInfo').textContent=selected?(self?'Нельзя менять собственную роль':selected.role?'Выбран: '+selected.nickname+' · '+(roleLabels[selected.role]||selected.role):'Выбран: '+selected.nickname):'';
const canRevoke=selected&&selected.role&&!self&&(developer||(user.role==='admin'&&['minister','leader','senior'].includes(selected.role))||(user.role==='minister'&&['leader','senior'].includes(selected.role)));
$('revokeBtn').classList.toggle('hide',!canRevoke);
};
$('assignBtn').onclick=async()=>{
if(!selected||selected.id===user.id||(selected.role&&user.role!=='developer'))return;
clear();const role=$('assignRole').value,department=['developer','admin','minister'].includes(role)?'ALL':$('assignDept').value;
const previous=selected.role;
if(previous&&!confirm('Изменить роль сотрудника '+selected.nickname+'?'))return;
$('assignBtn').disabled=true;
try{await api('/api/roles/assign',{method:'POST',body:{target_id:selected.id,role,department}});selected=null;$('findUser').click();error('actionSuccess','');toast(previous?'Роль изменена':'Роль назначена');}
catch(x){const msg=failure(x);error('actionError',msg);toast(msg,true);}
finally{$('assignBtn').disabled=!selected;}
};
$('revokeBtn').onclick=async()=>{if(!selected||!selected.role||!confirm('Снять роль с '+selected.nickname+'?'))return;clear();$('revokeBtn').disabled=true;try{await api('/api/roles/revoke',{method:'POST',body:{target_id:selected.id}});$('revokeBtn').classList.add('hide');selected=null;$('findUser').click();error('actionSuccess','');toast('Роль снята');}catch(x){const msg=failure(x);error('actionError',msg);toast(msg,true);}finally{$('revokeBtn').disabled=false;}};
$('developerBootstrapForm').onsubmit=async event=>{
event.preventDefault();clear();const code=$('developerBootstrapToken').value;$('developerBootstrapToken').value='';
try{await api('/api/site/developer-bootstrap',{method:'POST',body:{bootstrap_token:code}});await refreshMe();toast('Роль разработчика активирована');}
catch(x){const msg=x.status===409?'Разработчик уже назначен':failure(x);error('actionError',msg);toast(msg,true);}
};
$('bootstrapForm').onsubmit=async e=>{e.preventDefault();clear();const code=$('bootstrapToken').value;$('bootstrapToken').value='';try{await api('/api/site/bootstrap',{method:'POST',body:{bootstrap_token:code}});await refreshMe();error('actionSuccess','');toast('Доступ открыт');}catch(x){const msg=x.status===409?'Администратор уже назначен':failure(x);error('actionError',msg);toast(msg,true);}};
window.addEventListener('hashchange',()=>{if(!user)tab(location.hash==='#register'?'register':'login');});
tab(location.hash==='#register'?'register':'login');refreshMe();
})();
</script>
</body>
</html>
