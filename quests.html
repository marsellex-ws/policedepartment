<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#051526"><title>Квесты — Police Department</title><link rel="icon" href="pd_photo.png" type="image/png"><script src="site-session.js"></script><script src="role-ui.js" defer></script>
<style>
:root{--bg:#06101f;--panel:#0b1d31;--line:#24486c;--blue:#75bcff;--mint:#5bdfbc;--gold:#ffd185;--muted:#95aec6;color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 17% 0,#10477666,transparent 36%),radial-gradient(ellipse at 90% 14%,#8f2b7640,transparent 31%),linear-gradient(160deg,#050d1a,#071629 60%,#070e1a);background-attachment:fixed;color:#edf6ff;font:14px/1.5 Inter,'Segoe UI',Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.53;cursor:wait}a{color:inherit;text-decoration:none}.shell{width:min(1270px,calc(100% - 36px));margin:auto}.top{position:sticky;z-index:40;top:0;height:76px;border-bottom:1px solid #31567883;backdrop-filter:blur(17px);background:linear-gradient(90deg,#081b2be9,#061423ef),url('reestr_shapk.png') center/cover}.topin{height:100%;display:flex;align-items:center;gap:15px;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:950;font-size:17px;letter-spacing:.05em}.brand img{width:44px;height:48px;object-fit:contain}.pd-header-user-slot{margin-left:auto}.hero{text-align:center;padding:48px 0 20px}.eyebrow{color:#8abaff;font-size:11px;font-weight:850;letter-spacing:.28em}.hero h1{font-size:clamp(38px,5vw,63px);font-weight:1000;margin:7px 0 10px;line-height:1.03;letter-spacing:-.055em}.hero h1 em{font-style:normal;background:linear-gradient(90deg,#a4dfff,#55b8ff 65%,#ec96de);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{margin:0;color:#9db5ce}.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:26px 0}.overview .stat{background:#0a2136c5;border:1px solid #3765898c;border-radius:17px;padding:17px 18px;box-shadow:inset 0 0 25px #1b6ab312}.stat small{font-size:10px;letter-spacing:.1em;color:#9bb9d0;font-weight:850}.stat strong{display:block;font-size:25px;color:#e6f7ff;margin-top:5px;font-variant-numeric:tabular-nums}.stat .accent{color:#69e8c4}.tabs{display:flex;align-items:center;gap:9px;overflow-x:auto;border-bottom:1px solid #3857798a;margin:0 0 20px;padding-bottom:2px;scrollbar-width:none}.tabs button{border:0;background:none;color:#9fb7cf;font-size:12px;font-weight:950;letter-spacing:.075em;white-space:nowrap;padding:13px 18px;position:relative}.tabs button.active{color:#fff}.tabs button.active:after{content:"";position:absolute;bottom:0;left:13%;right:13%;height:3px;border-radius:5px;background:linear-gradient(90deg,#4af1d1,#61b8ff,#d08aff);box-shadow:0 0 15px #3d9aff}.section[hidden]{display:none!important}.headrow{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:4px 0 16px;flex-wrap:wrap}.headrow h2{font-size:20px;margin:0}.filter{display:flex;align-items:center;gap:8px}.filter select,.filter input{min-width:120px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.card{background:linear-gradient(155deg,#102d4bde,#0a1b30eb 65%,#10182ddd);border:1px solid #376a9590;border-radius:17px;padding:18px;box-shadow:inset 0 0 28px #164b5e15,0 9px 28px #0003;min-width:0}.card .topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-weight:850;font-size:10px;letter-spacing:.1em;border-radius:6px;background:#165c61;color:#93f5d8;padding:4px 8px;white-space:nowrap}.tag.leader{background:#54406b;color:#f3bcfa}.card h3{font-size:17px;margin:13px 0 9px;line-height:1.25}.card p{color:#98b6d0;font-size:12px;line-height:1.6;min-height:37px;margin:0 0 17px}.card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px}.points{font-weight:1000;font-size:22px;color:#b9eaff}.points small{font-size:11px;color:#85a8c2}.card button,.primary{background:linear-gradient(100deg,#2766a4,#186d8e);border:1px solid #65baff94;border-radius:10px;color:#fff;padding:10px 15px;font-weight:850;font-size:12px}.card button:hover,.primary:hover{filter:brightness(1.2)}.panel{background:#0c2139c9;border:1px solid #3c709b72;border-radius:18px;padding:19px}.panel h3{margin:0 0 13px;font-size:17px}.empty{text-align:center;padding:38px 15px;color:#a8c1d7}.table-wrap{overflow:auto;max-height:660px;border:1px solid #33577688;border-radius:15px}table{width:100%;border-collapse:collapse;min-width:690px}th{text-align:left;font-size:11px;letter-spacing:.08em;color:#9ed3f8;background:#0d2a47;padding:12px}td{border-top:1px solid #25456180;padding:12px;font-size:12px;color:#c9dff0}td strong{color:#f2faff}.pill{display:inline-block;border:1px solid #3b7186;background:#183b53;border-radius:8px;padding:4px 8px;font-size:10px;color:#99ead7;font-weight:800}.pill.pending{border-color:#8a783b;color:#ffdf94;background:#47381666}.pill.rejected{border-color:#8a445c;color:#ffb5c9;background:#5c223544}.action-row{display:flex;gap:10px;flex-wrap:wrap}.action-row a{color:#98cfff;font-weight:800}.modal[hidden]{display:none!important}.modal{position:fixed;z-index:120;inset:0;background:#030916d9;display:grid;place-items:center;padding:16px;backdrop-filter:blur(12px)}.dialog{width:min(540px,100%);max-height:90vh;overflow:auto;background:linear-gradient(150deg,#143151,#081728 80%);border:1px solid #78bfff88;border-radius:21px;box-shadow:0 35px 100px #0009;padding:24px}.dialog h2{margin:0 0 8px;font-size:25px}.dialog p{margin:0 0 17px;color:#9cbcd7;font-size:13px}.field{display:grid;gap:5px;margin:13px 0;font-size:12px;color:#b6d6e8;font-weight:750}.field input,.field textarea,.field select,.filter select,.filter input{width:100%;background:#071a2c;color:#eff9ff;border:1px solid #3c6e95;border-radius:10px;padding:11px 12px;min-width:0}.field textarea{min-height:82px;resize:vertical}.dialog-foot{display:flex;gap:10px;margin-top:18px}.dialog-foot button{flex:1;min-height:45px}.ghost{border:1px solid #4b799b;border-radius:10px;padding:10px 14px;background:#0b2640;color:#cbecff}.notice{min-height:20px;color:#93f4c6;font-size:12px;font-weight:750;margin:10px 0}.notice.bad{color:#ffb2c2}.footer{background:#05121fcc;border-top:1px solid #31567686;margin-top:45px;padding:28px 0}.footinner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#9bb6ce;font-size:11px}.footinner nav{display:flex;gap:18px;flex-wrap:wrap}.footinner a:hover{color:white}.admin-link{color:#bceaff;font-size:12px;font-weight:850}.rightnote{font-size:11px;color:#89a9be}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){.shell{width:calc(100% - 20px)}.hero{padding:33px 0 11px}.overview{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.card p{min-height:0}.brand{font-size:12px}.brand img{width:35px}.overview .stat{padding:12px}.stat strong{font-size:21px}.hero h1{font-size:37px}.tabs button{padding:12px 10px}}
</style></head><body>
<header class="top"><div class="shell topin"><a class="brand pd-unified-brand" href="index.html"><img src="pd_photo.png" alt=""><strong>POLICE DEPARTMENT</strong></a><div class="pd-header-user-slot" data-police-user-slot></div></div></header>
<main class="shell"><div class="hero"><div class="eyebrow">LSPD · SFPD · LVPD</div><h1><em>КВЕСТЫ</em> И БАЛЛЫ</h1><p>Работы, отчёты и обмен наград</p></div>
<div class="overview"><div class="stat"><small>БАЛАНС</small><strong id="balance">—</strong></div><div class="stat"><small>ДЕПАРТАМЕНТ</small><strong id="myDept">—</strong></div><div class="stat"><small>СТАТУС</small><strong id="myRank">—</strong></div><div class="stat"><small>ЗАЯВКИ</small><strong class="accent" id="myRequests">—</strong></div></div>
<div class="tabs" role="tablist" aria-label="Разделы квестов"><button class="active" data-tab="jobs" type="button">РАБОТЫ</button><button data-tab="shop" type="button">ОБМЕН БАЛЛОВ</button><button data-tab="requests" type="button">МОИ ЗАЯВКИ</button><button data-tab="history" type="button">ИСТОРИЯ</button><button data-tab="roster" type="button" id="rosterTab" hidden>СОСТАВ</button></div>
<section id="panel-jobs" class="section"><div class="headrow"><h2>Доступные работы</h2><div class="filter"><select id="jobFilter" aria-label="Категория"><option value="all">Все работы</option><option value="common">Общие</option><option value="leader">Для шефов</option></select></div></div><div class="cards" id="jobsCards"></div></section>
<section id="panel-shop" class="section" hidden><div class="headrow"><h2>Магазин баллов</h2></div><div class="cards" id="shopCards"></div></section>
<section id="panel-requests" class="section" hidden><div class="headrow"><h2>Заявки</h2><button class="ghost" id="refreshRequests">Обновить</button></div><div class="table-wrap" id="requestTable"></div></section>
<section id="panel-history" class="section" hidden><div class="headrow"><h2>История баллов</h2></div><div class="table-wrap" id="historyTable"></div></section>
<section id="panel-roster" class="section" hidden><div class="headrow"><h2>Состав департаментов</h2><a class="admin-link" href="admin.html#quests">Управление</a></div><div class="table-wrap" id="rosterTable"></div></section>
<div class="notice" id="notice" role="status" aria-live="polite"></div></main>
<footer class="footer"><div class="shell footinner"><span>© marsellex · С 2024 по настоящее время</span><nav><a target="_blank" rel="noopener" href="https://vk.com/marsellex">VK</a><a target="_blank" rel="noopener" href="https://t.me/marsellex1">Telegram</a><a href="index.html">Police Department</a></nav></div></footer>
<div class="modal" id="reqModal" hidden><form class="dialog" id="questForm"><h2 id="modalTitle">Отправить отчёт</h2><p id="modalDesc"></p><label class="field" id="qtyField">Количество<input id="quantity" type="number" min="1" max="1000000" step="1" value="1" required></label><label class="field" id="pointsField" hidden>Баллы<input id="requestedPoints" type="number" min="0" step="0.1"></label><label class="field" id="evidenceField">Доказательства (HTTPS-ссылка)<input id="evidence" type="url" placeholder="https://..." autocomplete="off"></label><label class="field">Комментарий<textarea id="reqNote" maxlength="800"></textarea></label><div class="notice" id="modalError" role="status"></div><div class="dialog-foot"><button type="button" id="modalCancel" class="ghost">Отмена</button><button type="submit" class="primary" id="modalSubmit">Отправить</button></div></form></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),API='https://police-api-b2y4.onrender.com';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:2}).format(Number(n)||0);let data=null,selected=null,kind='quest',tab='jobs';
async function req(path,method='GET',body){const token=window.PoliceSession?.get?.();if(!token)throw Error('Войди в аккаунт Police Department');const h={Authorization:'Bearer '+token,Accept:'application/json'};if(body!==undefined)h['Content-Type']='application/json';const controller=new AbortController(),tid=setTimeout(()=>controller.abort(),18000);try{const r=await fetch(API+path,{method,headers:h,body:body===undefined?undefined:JSON.stringify(body),cache:'no-store',signal:controller.signal});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw Error(j.error||`Ошибка ${r.status}`);return j;}finally{clearTimeout(tid)}}
function show(s,error=false){const el=$('notice');el.textContent=s;el.classList.toggle('bad',error)}
function roleName(){return {leader:'Шеф',senior:'Старший состав',minister:'Министр',admin:'Админ',developer:'Разработчик'}[data.me.role]||'Пользователь'}
function switchTab(name){tab=name;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.section').forEach(p=>p.hidden=p.id!=='panel-'+name);if(name==='requests')loadRequests();if(name==='history')loadHistory();if(name==='roster')loadRoster();}
const canApply=()=>['leader','senior'].includes(data?.me?.role)&&!!data?.me?.department;
function renderJobs(){const filter=$('jobFilter').value;const jobs=(data.jobs||[]).filter(x=>(x.audience==='all'||data.me.role==='leader'||!canApply())&&(filter==='all'||filter==='common'&&x.audience==='all'||filter==='leader'&&x.audience==='leader'));$('jobsCards').innerHTML=jobs.length?jobs.map(x=>`<article class="card"><div class="topline"><span class="tag ${x.audience==='leader'?'leader':''}">${x.audience==='leader'?'ШЕФЫ':'8–10 РАНГИ'}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.requirements)}</p><div class="card-foot"><div class="points">${fmt(x.points_min)}${Number(x.points_max)!==Number(x.points_min)?'–'+fmt(x.points_max):''} <small>балл.</small></div><button type="button" data-job="${esc(x.id)}" ${!canApply()?'disabled':''}>Выполнить</button></div></article>`).join(''):'<div class="empty">Работы не найдены</div>';}
function renderShop(){const available=data.rewards.filter(x=>x.audience===data.me.track||!canApply());$('shopCards').innerHTML=available.map(x=>`<article class="card"><div class="topline"><span class="tag ${x.audience==='leader'?'leader':''}">${x.audience==='leader'?'ШЕФЫ':'СТАРШИЙ СОСТАВ'}</span></div><h3>${esc(x.title)}</h3><p>${esc(x.conditions||'После одобрения заявки')}</p><div class="card-foot"><div class="points">${x.cost===null?'По запросу':fmt(x.cost)+' <small>балл.</small>'}</div><button type="button" data-reward="${esc(x.id)}" ${!canApply()||x.cost===null?'disabled':''}>Обменять</button></div></article>`).join('');}
function renderTable(target,heads,items,mapping){$(target).innerHTML=items.length?`<table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${items.map(x=>`<tr>${mapping(x).map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Записей пока нет</div>'}
async function loadRequests(){try{const r=await req('/api/portal/quests/requests');const mine=r.items.filter(x=>x.requested_by===data.me.login);$('myRequests').textContent=mine.length;renderTable('requestTable',['Дата','Название','Баллы','Статус'],mine,x=>[esc(new Date(x.created_at).toLocaleDateString('ru-RU')),esc(x.item_title),fmt(x.points),`<span class="pill ${esc(x.status)}">${({pending:'На проверке',approved:'Одобрено',rejected:'Отклонено'})[x.status]||'—'}</span>`]);}catch(e){show(e.message,true)}}
async function loadHistory(){try{const [r,l]=await Promise.all([req('/api/portal/quests/history'),req('/api/portal/quests/ledger')]);const modern=(l.items||[]).map(x=>({date:x.created_at,desc:x.description,amount:x.amount}));const legacy=(r.items||[]).map(x=>({date:x.event_date||x.date_text||'',desc:x.description||x.event_type,amount:x.amount}));renderTable('historyTable',['Дата','Операция','Баллы'],[...modern,...legacy],x=>[esc(x.date?.slice?.(0,10)||x.date),esc(x.desc),fmt(x.amount)]);}catch(e){show(e.message,true)}}
async function loadRoster(){try{const r=await req('/api/portal/quests/roster');renderTable('rosterTable',['PD','Сотрудник','Роль','Баланс'],r.items,x=>[esc(x.department),esc(x.nickname),x.track==='leader'?'Шеф':x.track==='blacklist'?'ЧС':'СС',fmt(x.balance)]);}catch(e){show(e.message,true)}}
function openForm(x,k){selected=x;kind=k;$('modalTitle').textContent=k==='quest'?'Отчёт: '+x.title:'Обмен: '+x.title;$('modalDesc').textContent=k==='quest'?x.requirements:'Стоимость: '+fmt(x.cost)+' баллов';$('questForm').reset();$('modalError').textContent='';$('evidenceField').hidden=k!=='quest';$('qtyField').hidden=k==='reward'||!['per_unit','online','premium'].includes(x.calc_type);$('quantity').required=!$('qtyField').hidden;$('pointsField').hidden=k!=='quest'||x.calc_type!=='range';$('requestedPoints').required=!$('pointsField').hidden;$('requestedPoints').min=x.points_min??0;$('requestedPoints').max=x.points_max??500;$('requestedPoints').value=x.points_min||0;$('reqModal').hidden=false;}
$('questForm').addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;const btn=$('modalSubmit');btn.disabled=true;$('modalError').textContent='';try{const p={kind,item_id:selected.id,quantity:Number($('quantity').value)||1,points:Number($('requestedPoints').value),evidence_url:$('evidence').value.trim(),note:$('reqNote').value.trim()};await req('/api/portal/quests/requests','POST',p);$('reqModal').hidden=true;show('Заявка отправлена на проверку');switchTab('requests');}catch(err){$('modalError').textContent=err.message}finally{btn.disabled=false}});
$('modalCancel').onclick=()=>{$('reqModal').hidden=true};$('reqModal').addEventListener('click',e=>{if(e.target.id==='reqModal')$('reqModal').hidden=true});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('reqModal').hidden=true});
$('jobsCards').onclick=e=>{const b=e.target.closest('[data-job]');if(b){const x=data.jobs.find(v=>v.id===b.dataset.job);if(x)openForm(x,'quest')}};$('shopCards').onclick=e=>{const b=e.target.closest('[data-reward]');if(b){const x=data.rewards.find(v=>v.id===b.dataset.reward);if(x)openForm(x,'reward')}};
$('jobFilter').onchange=renderJobs;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));$('refreshRequests').onclick=loadRequests;
async function init(){if(!window.PoliceSession?.get?.()){show('Для квестов войди в аккаунт Police Department',true);$('jobsCards').innerHTML='<div class="empty"><a class="primary" href="entrance.html">Войти</a></div>';return}try{data=await req('/api/portal/quests/bootstrap');$('balance').textContent=data.member?fmt(data.member.balance):'0';$('myDept').textContent=data.me.department||'Все PD';$('myRank').textContent=roleName();$('myRequests').textContent='—';$('rosterTab').hidden=!['all','leader'].includes(data.me.permissions);if(!canApply())show('Редактирование баллов и заявок доступно по назначенной роли');renderJobs();renderShop();loadRequests();}catch(e){show(e.message,true);$('jobsCards').innerHTML='<div class="empty">Данные недоступны. Обновите страницу.</div>'}}
init();
})();
</script></body></html>
